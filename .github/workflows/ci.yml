name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API server (lint and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  moodle:
    name: Moodle plugin (PHP syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
      - name: php -l
        run: |
          status=0
          while IFS= read -r -d '' f; do php -l "$f" > /dev/null || status=1; done \
            < <(find integrations/moodle -name '*.php' -print0)
          exit $status
